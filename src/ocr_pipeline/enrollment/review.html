    if (status === 'check' || status === 'missing') {
      var reason = (value.problems && value.problems[0]) ||
        (value.audit_sample ? 'Picked for a random spot-check.' : 'Needs a second look.');
      return h('p', { class: 'value-reason' }, reason);
    }
    return renderSourceLine(value) || h('p', { class: 'value-reason' }, 'No source recorded.');
  }

  // Conflicting readings across documents: current source first, then each alternative
  // with a one-click "Use this" that re-points the value at that document's evidence.
  function renderConflictComparison(value, locked) {
    if (!value.alternatives || !value.alternatives.length) return null;
    var wrap = h('div', { class: 'value-conflict' });
    wrap.appendChild(h('p', { class: 'value-conflict-label' }, 'Documents disagree:'));
    var list = h('ul', { class: 'value-conflict-list' });
    if (value.evidence && value.evidence.length) {
      var currentEv = value.evidence[0];
      list.appendChild(h('li', { class: 'value-conflict-row current' },
        h('span', { class: 'value-conflict-doc' }, documentLabel(currentEv.document_id) + ' · p' + currentEv.page),
        h('span', { class: 'value-conflict-val' }, value.raw_value || value.value || '—'),
        h('span', { class: 'tag' }, 'Current')
      ));
    }
    value.alternatives.forEach(function (alt) {
      var ev = alt.evidence && alt.evidence[0];
      var row = h('li', { class: 'value-conflict-row' },
        h('span', { class: 'value-conflict-doc' }, ev ? (documentLabel(ev.document_id) + ' · p' + ev.page) : 'Unknown source'),
        h('span', { class: 'value-conflict-val' }, alt.value)
      );
      if (ev && !locked) {
        var useBtn = h('button', { type: 'button', class: 'button' }, 'Use this');
        useBtn.addEventListener('click', function () {
          postAction({ action: 'change_source', value_id: value.id, source: { document_id: ev.document_id, page: ev.page, region_ids: ev.region_ids || [] } });
        });
        row.appendChild(useBtn);
      }
      list.appendChild(row);
    });
    wrap.appendChild(list);
    return wrap;
  }

  function displayValueText(value) {
    if (value.parts) {
      var order = ['line1', 'line2', 'city', 'state', 'zip'];
      var line = order.map(function (k) { return value.parts[k]; }).filter(Boolean).join(', ');
      return line || value.value || '';
    }
    return value.value;
  }

  function renderValueRow(value, locked) {
    var selected = state.selectedValueId === value.id;
    var status = valueStatus(value);
    var row = h('div', { class: 'value-row' + (selected ? ' selected' : ''), 'data-value-id': value.id });
    var main = h('button', { type: 'button', class: 'value-main' });
    main.addEventListener('click', function () { selectValue(value.id); });
    main.appendChild(h('span', { class: 'value-label-col' }, h('span', { class: 'value-label' }, value.label), value.role ? h('span', { class: 'value-role' }, value.role) : null));
    var text = displayValueText(value);
    main.appendChild(h('span', { class: 'value-text' + (text ? '' : ' empty') }, text || 'Not captured'));
    var chips = h('span', { class: 'value-chips' }, statusChip(value));
    if (value.audit_sample) chips.appendChild(h('span', { class: 'tag' }, 'Audit'));
    main.appendChild(chips);
    row.appendChild(main);

    if (value.parts && value.parts.phone) row.appendChild(h('span', { class: 'value-raw' }, 'Phone: ' + value.parts.phone));
    if (value.raw_value && value.raw_value !== value.value && !value.parts) row.appendChild(h('span', { class: 'value-raw' }, 'Printed: ' + value.raw_value));

    if (value.review.state === 'edited') {
      var lastEdit = findLastEdit(value.id);
      var original = lastEdit && lastEdit.before ? lastEdit.before.value : null;
      if (original != null && original !== value.value) {
        row.appendChild(h('p', { class: 'value-edit-diff' }, h('s', {}, original), ' → ', value.value || ''));
      }
    }

    row.appendChild(renderStatusLine(value, status));

    if (selected) {
      var details = renderDetailsDisclosure(value);
      if (details) row.appendChild(details);
      var conflict = renderConflictComparison(value, locked);
      if (conflict) row.appendChild(conflict);
    }

    if (!locked && selected) {
      if (state.editingValueId === value.id) {
        row.appendChild(renderEditRow(value));
      } else if (state.rejectingValueId === value.id) {
        row.appendChild(renderRejectRow(value));
      } else if (state.pickingSourceFor === value.id) {
        row.appendChild(h('div', { class: 'picking-row' }, h('span', { class: 'muted' }, 'Pick a region on the image, or press Esc.')));
      } else {
        var actions = h('div', { class: 'value-actions' });
        var approve = h('button', { type: 'button', class: 'button' }, icon('check'), 'Approve');
        approve.addEventListener('click', function () { postAction({ action: 'approve', value_id: value.id }); });
        var edit = h('button', { type: 'button', class: 'button' }, icon('edit'), 'Edit');
        edit.addEventListener('click', function () { state.editingValueId = value.id; renderCase(); });
        var changeSrc = h('button', { type: 'button', class: 'button' }, icon('target'), 'Change source');
        changeSrc.addEventListener('click', function () { state.pickingSourceFor = value.id; selectValue(value.id); });
        var reject = h('button', { type: 'button', class: 'button' }, icon('x'), 'Reject');
        reject.addEventListener('click', function () { state.rejectingValueId = value.id; renderCase(); });
        actions.appendChild(approve); actions.appendChild(edit); actions.appendChild(changeSrc); actions.appendChild(reject);
        row.appendChild(actions);
      }
    }
    return row;
  }
  function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function renderEditRow(value) {
    var row = h('div', { class: 'edit-row' });
    var input = h('input', { type: 'text', value: value.value || '', 'aria-label': 'New value for ' + value.label });
    var save = h('button', { type: 'button', class: 'button primary' }, 'Save');
    var cancel = h('button', { type: 'button', class: 'button' }, 'Cancel');
    save.addEventListener('click', function () { postAction({ action: 'edit', value_id: value.id, value: input.value }); });
    cancel.addEventListener('click', function () { state.editingValueId = null; renderCase(); });
    row.appendChild(input); row.appendChild(save); row.appendChild(cancel);
    return row;
  }

  function renderRejectRow(value) {
    var row = h('div', { class: 'reject-row' });
    var select = h('select', { 'aria-label': 'Reject reason' });
    REJECT_REASONS.forEach(function (r) { select.appendChild(h('option', { value: r[0] }, r[1])); });
    var note = h('input', { type: 'text', placeholder: 'Details', 'aria-label': 'Reject details' });
    var confirm = h('button', { type: 'button', class: 'button danger' }, 'Confirm');
    var cancel = h('button', { type: 'button', class: 'button' }, 'Cancel');
    confirm.addEventListener('click', function () {
      if (!note.value.trim()) { note.focus(); return; }
      postAction({ action: 'reject', value_id: value.id, reason_code: select.value, reason: note.value.trim() });
    });
    cancel.addEventListener('click', function () { state.rejectingValueId = null; renderCase(); });
    row.appendChild(select); row.appendChild(note); row.appendChild(confirm); row.appendChild(cancel);
    return row;
  }

  function renderAddAttribute(locked) {
    if (locked) return document.createDocumentFragment();
    if (!state.addingAttribute) {
      var open = h('button', { type: 'button', class: 'button' }, icon('plus'), 'Add attribute');
      open.addEventListener('click', function () { state.addingAttribute = true; renderCase(); });
      return h('div', {}, open);
    }
    var wrap = h('div', { class: 'add-attribute' });
    var labelInput = h('input', { type: 'text', placeholder: 'Label', 'aria-label': 'New attribute label' });
    var valueInput = h('input', { type: 'text', placeholder: 'Value', 'aria-label': 'New attribute value' });
    var roleInput = h('input', { type: 'text', placeholder: 'Role (optional)', 'aria-label': 'New attribute role' });
    var add = h('button', { type: 'button', class: 'button primary' }, 'Add');
    var cancel = h('button', { type: 'button', class: 'button' }, 'Cancel');
    add.addEventListener('click', function () {
      if (!labelInput.value.trim() || !valueInput.value.trim()) return;
      postAction({ action: 'add', label: labelInput.value.trim(), value: valueInput.value.trim(), role: roleInput.value.trim() || undefined });
    });
    cancel.addEventListener('click', function () { state.addingAttribute = false; renderCase(); });
    wrap.appendChild(h('div', { class: 'fields' }, labelInput, valueInput, roleInput, add, cancel));
    return wrap;
  }

  // Automated pipeline steps, as opposed to something a reviewer did; collapsed by
  // default so the audit tab reads as a reviewer's history, not a processing log.
  var SYSTEM_AUDIT_ACTIONS = { intake: true, classify: true, ocr: true, extract: true, processed: true };
  var AUDIT_ACTION_LABELS = {
    approve: 'Approved', edit: 'Edited', reject: 'Rejected', add: 'Added attribute',
    resolve_exception: 'Resolved exception', submit: 'Submitted', reject_case: 'Rejected case',
    change_source: 'Changed source', reclassify: 'Reclassified document',
    intake: 'Intake', classify: 'Classified', ocr: 'OCR', extract: 'Extracted', processed: 'Processed',
  };
  function auditActionLabel(action) { return AUDIT_ACTION_LABELS[action] || action; }

  // Only what a person needs from an event: the field's value (or the review decision),
  // never the stored record behind it. The full record stays in the audit download.
  function auditDisplay(ev, side) {
    if (side == null) return '';
    if (typeof side !== 'object') return String(side);
    if (ev.action === 'bulk_approve') return side.value_ids ? side.value_ids.length + ' routine values approved' : '';
    if (ev.action === 'submit') return 'Sent downstream';
    if ('value' in side) {
      var shown = side.value == null || side.value === '' ? 'empty' : String(side.value);
      if (ev.action === 'approve' || ev.action === 'reject') {
        return side.review && side.review.state !== 'pending' ? shown + ' (' + side.review.state + ')' : shown;
      }
      return shown;
    }
    if ('state' in side && 'message' in side) return side.message + ' (' + side.state + ')';
    if ('status' in side) return side.status;
    if ('reason' in side) return side.reason;
    return '';
  }

  function auditTable(events) {
    var table = h('table', { class: 'audit-table' });
    table.appendChild(h('thead', {}, h('tr', {},
      h('th', {}, 'Time'), h('th', {}, 'Who'), h('th', {}, 'What'), h('th', {}, 'Field'), h('th', {}, 'Before → after'), h('th', {}, 'Reason'))));
    var tbody = h('tbody', {});
    events.forEach(function (ev) {
      var value = ev.value_id ? valueById(ev.value_id) : null;
      var before = auditDisplay(ev, ev.before);
      var after = auditDisplay(ev, ev.after);
      tbody.appendChild(h('tr', {},
        h('td', {}, formatDate(ev.ts)),
        h('td', {}, ev.actor),
        h('td', {}, auditActionLabel(ev.action)),
        h('td', {}, value ? value.label : (ev.value_id || '—')),
        h('td', {}, before + (before || after ? ' → ' : '') + after),
        h('td', {}, ev.reason || '—')
      ));
    });
    table.appendChild(tbody);
    return table;
  }

  function renderAuditTab() {
    var frag = document.createDocumentFragment();
    var events = state.bundle.audit || [];
    var humanEvents = events.filter(function (ev) { return !SYSTEM_AUDIT_ACTIONS[ev.action]; });
    var systemEvents = events.filter(function (ev) { return SYSTEM_AUDIT_ACTIONS[ev.action]; });

    if (humanEvents.length) frag.appendChild(auditTable(humanEvents));
    else frag.appendChild(h('p', { class: 'empty-note' }, 'No reviewer actions yet.'));

    if (systemEvents.length) {
      frag.appendChild(h('details', { class: 'audit-system-group' },
        h('summary', {}, 'System steps (' + systemEvents.length + ')'),
        auditTable(systemEvents)
      ));
    }

    var processingTime = renderProcessingTimeDisclosure();
    if (processingTime) frag.appendChild(processingTime);
    return frag;
  }

  // Render, classify, OCR and extract seconds per document only: no ocr.* sub-steps
  // and no model or engine names, collapsed since it is a debugging detail, not a review task.
  function renderProcessingTimeDisclosure() {
    var docs = (state.bundle.documents || []).filter(function (doc) {
      return doc.timings && STAGE_CHART_KEYS.some(function (key) { return doc.timings[key] != null; });
    });
    if (!docs.length) return null;
    var details = h('details', { class: 'timing-disclosure' }, h('summary', {}, 'Processing time'));
    docs.forEach(function (doc) {
      var stages = STAGE_CHART_KEYS.filter(function (key) { return doc.timings[key] != null; });
      var max = Math.max.apply(null, stages.map(function (s) { return doc.timings[s]; }));
      var block = h('div', { class: 'timing-doc' }, h('h4', {}, doc.file_name));
      stages.forEach(function (s) {
        var seconds = doc.timings[s];
        var pct = max > 0 ? (seconds / max * 100) : 0;
        block.appendChild(h('div', { class: 'timing-bar-row' },
          h('span', {}, STAGE_CHART_LABELS[s]),
          h('div', { class: 'timing-bar-track' }, h('div', { class: 'timing-bar-fill', style: 'width:' + pct + '%' })),
          h('span', {}, seconds.toFixed(2) + 's')
        ));
      });
      details.appendChild(block);
    });
    return details;
  }

  /* ---- footer ---- */
  /* ---------- keyboard: J/K move, Enter approve, E edit, S source, R reject, Esc cancel ---------- */
  function moveSelection(list, dir) {
    var ids = list.map(function (v) { return v.id; });
    var idx = ids.indexOf(state.selectedValueId);
    var nextIdx = idx === -1 ? (dir > 0 ? 0 : ids.length - 1) : (idx + dir + ids.length) % ids.length;
    selectValue(ids[nextIdx]);
  }

  document.addEventListener('keydown', function (ev) {
    var tag = (ev.target && ev.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (!state.bundle) return;
    if (ev.key === 'Escape') {
      if (state.pickingSourceFor || state.editingValueId || state.rejectingValueId) {
        state.pickingSourceFor = null; state.editingValueId = null; state.rejectingValueId = null;
        renderCase();
      }
      return;
    }
    if (state.offline || isLocked()) return;
    var attention = pendingAttentionValues();
    if (!attention.length) return;
    if (ev.key === 'j' || ev.key === 'J') { ev.preventDefault(); moveSelection(attention, 1); return; }
    if (ev.key === 'k' || ev.key === 'K') { ev.preventDefault(); moveSelection(attention, -1); return; }
    var value = state.selectedValueId ? valueById(state.selectedValueId) : null;
    if (!value || !attention.some(function (v) { return v.id === value.id; })) return;
    if (state.editingValueId || state.rejectingValueId || state.pickingSourceFor) return;
    if (ev.key === 'Enter') { ev.preventDefault(); postAction({ action: 'approve', value_id: value.id }); }
    else if (ev.key === 'e' || ev.key === 'E') { ev.preventDefault(); state.editingValueId = value.id; renderCase(); }
    else if (ev.key === 's' || ev.key === 'S') { ev.preventDefault(); state.pickingSourceFor = value.id; selectValue(value.id); }
    else if (ev.key === 'r' || ev.key === 'R') { ev.preventDefault(); state.rejectingValueId = value.id; renderCase(); }
  });

  /* ================= OFFLINE BUNDLE ================= */
  function renderOfflineCase() {
    state.caseId = (window.ENROLLMENT_BUNDLE.case || {}).case_id || null;
    state.bundle = window.ENROLLMENT_BUNDLE;
    state.selectedDocumentId = state.bundle.documents.length ? state.bundle.documents[0].document_id : null;
    renderCase();
  }

  /* ================= METRICS ================= */
  var SVG_NS = 'http://www.w3.org/2000/svg';
  function svg(tag, attrs) {
    var el = document.createElementNS(SVG_NS, tag);
    Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k, attrs[k]); });
    return el;
  }

  function renderMetrics() {
    var app = document.getElementById('app');
    app.textContent = '';
    app.appendChild(renderTopTabs('metrics'));
    app.appendChild(h('p', { class: 'empty-note' }, 'Loading metrics…'));
    apiGet('/api/metrics').then(function (m) {
      app.textContent = '';
      app.appendChild(renderTopTabs('metrics'));
      var kpis = h('div', { class: 'kpi-grid' },
        kpiTile('Cases', m.cases),
        kpiTile('Documents', m.documents),
        kpiTile('Pages', m.pages),
        kpiTile('Exception rate', pct(m.exception_rate), exceptionRateNote(m)),
        kpiTile('Manual-touch rate', pct(m.manual_touch_rate), manualTouchNote(m)),
        kpiTile('Field accuracy', pct(m.field_accuracy)),
        kpiTile('Audit accuracy', pct(m.audit_accuracy))
      );
      app.appendChild(kpis);
      var routesNote = routesSummarySentence(m.routes || {});
      if (routesNote) app.appendChild(h('p', { class: 'metrics-summary' }, routesNote));
      var grid = h('div', { class: 'chart-grid' });
      grid.appendChild(confidenceHistogramChart(m.confidence_histogram || []));
      grid.appendChild(perCaseLineChart(m.by_case || []));
      grid.appendChild(routesChart(m.routes || {}));
      grid.appendChild(stageChart(m.stage_seconds || {}));
      app.appendChild(grid);
    }).catch(function (err) {
      app.textContent = '';
      app.appendChild(renderTopTabs('metrics'));
      app.appendChild(h('p', { class: 'inline-message', role: 'alert' }, friendlyMessage(err, 'Could not load metrics.')));
    });
  }

  function kpiTile(label, value, note) {
    var tile = h('div', { class: 'kpi-tile' }, h('span', { class: 'kpi-label' }, label), h('span', { class: 'kpi-value' }, String(value == null ? '—' : value)));
    if (note) tile.appendChild(h('span', { class: 'kpi-note' }, note));
    return tile;
  }
  function pct(x) { return x == null ? '—' : (Math.round(x * 1000) / 10) + '%'; }

  // Natural-frequency framing (counts, not just percentages) from the exact totals the API gives us.
  function exceptionRateNote(m) {
    if (m.exception_rate == null || !m.cases) return null;
    return Math.round(m.exception_rate * m.cases) + ' of ' + m.cases + ' tickets have an open exception.';
  }
  function manualTouchNote(m) {
    var cases = m.by_case || [];
    var totalValues = cases.reduce(function (sum, c) { return sum + (c.values || 0); }, 0);
    var totalTouches = cases.reduce(function (sum, c) { return sum + (c.touches || 0); }, 0);
    if (!totalValues) return null;
    return totalTouches + ' of ' + totalValues + ' values needed a manual edit.';
  }
  function routesSummarySentence(routes) {
    var quick = routes.quick_verify || 0, priority = routes.priority_review || 0, exception = routes.exception || 0;
    var total = quick + priority + exception;
    if (!total) return null;
    return quick + ' of ' + total + ' values were verified automatically; ' + priority + ' needed a quick check and ' + exception + ' could not be found.';
  }

  function chartCard(title) {
    var card = h('div', { class: 'chart-card' });
    card.appendChild(h('h3', {}, title));
    return card;
  }

  function confidenceHistogramChart(counts) {
    var card = chartCard('Confidence distribution');
    var w = 380, h2 = 180, pad = 26;
    var max = Math.max(1, Math.max.apply(null, counts.length ? counts : [0]));
    var barW = (w - pad * 2) / Math.max(counts.length, 1);
    // Label every other bucket once there are more than a handful, so adjacent
    // axis labels never collide regardless of the card's rendered width.
    var labelEvery = counts.length > 6 ? 2 : 1;
    var s = svg('svg', { viewBox: '0 0 ' + w + ' ' + h2, role: 'img', 'aria-hidden': 'true' });
    counts.forEach(function (c, i) {
      var bh = (h2 - pad * 2) * (c / max);
      var x = pad + i * barW;
      var y = h2 - pad - bh;
      s.appendChild(svg('rect', { x: x + 1, y: y, width: Math.max(barW - 2, 1), height: Math.max(bh, 0), fill: 'var(--accent)' }));
      if (c > 0) {
        var countLabel = svg('text', { x: x + barW / 2, y: Math.max(y - 4, 10), 'text-anchor': 'middle', class: 'chart-axis-label' });
        countLabel.textContent = String(c);
        s.appendChild(countLabel);
      }
      if (i % labelEvery !== 0) return;
      var label = svg('text', { x: x + barW / 2, y: h2 - pad + 12, 'text-anchor': 'middle', class: 'chart-axis-label' });
      label.textContent = (i * 10) + '–' + ((i + 1) * 10);
      s.appendChild(label);
    });
    card.appendChild(s);
    var total = counts.reduce(function (a, b) { return a + b; }, 0);
    var best = counts.indexOf(Math.max.apply(null, counts.length ? counts : [0]));
    card.appendChild(h('p', { class: 'chart-summary' }, total ? ('10 buckets across ' + total + ' values; most fall in the ' + (best * 10) + '–' + ((best + 1) * 10) + '% range (' + counts[best] + ' values).') : 'No confidence data yet.'));
    return card;
  }

  // A legend row of colour swatches + text: colour is never the only signal (the
  // dashed-line swatch doubles the touches series' own stroke pattern).
  function chartLegend(entries) {
    var row = h('div', { class: 'chart-legend' });
    entries.forEach(function (e) {
      var swatch = h('span', { class: 'chart-legend-swatch' + (e.dashed ? ' dashed' : '') });
      swatch.style.background = e.dashed ? 'none' : e.color;
      swatch.style.color = e.color;
      row.appendChild(h('span', { class: 'chart-legend-item' }, swatch, e.label));
    });
    return row;
  }

  // A small chart with its own y-axis (min/max labelled) and point markers: used twice,
  // once per series, so two differently-scaled series never collapse onto one line.
  function miniLineChart(title, series, color) {
    var w = 380, h2 = 72, pad = 10, leftPad = 30;
    var max = Math.max.apply(null, series), min = Math.min.apply(null, series);
    var n = series.length;
    var stepX = n > 1 ? (w - leftPad - pad) / (n - 1) : 0;
    function yFor(v) { return max === min ? h2 / 2 : (h2 - pad - (v - min) / (max - min) * (h2 - pad * 2)); }
    var s = svg('svg', { class: 'mini-line-svg', viewBox: '0 0 ' + w + ' ' + h2, role: 'img', 'aria-hidden': 'true' });
    var d = series.map(function (v, i) { return (i === 0 ? 'M' : 'L') + (leftPad + i * stepX) + ',' + yFor(v); }).join(' ');
    s.appendChild(svg('path', { d: d, fill: 'none', stroke: color, 'stroke-width': '2.5' }));
    series.forEach(function (v, i) { s.appendChild(svg('circle', { cx: leftPad + i * stepX, cy: yFor(v), r: 2.6, fill: color })); });
    var maxLabel = svg('text', { x: 0, y: pad + 3, class: 'chart-axis-label' }); maxLabel.textContent = max.toFixed(1);
    s.appendChild(maxLabel);
    if (max !== min) {
      var minLabel = svg('text', { x: 0, y: h2 - pad + 3, class: 'chart-axis-label' }); minLabel.textContent = min.toFixed(1);
      s.appendChild(minLabel);
    }
    var wrap = h('div', { class: 'mini-chart' }, h('p', { class: 'mini-chart-title' }, title), s);
    return wrap;
  }

  function perCaseLineChart(byCase) {
    var card = chartCard('Minutes and touches per case');
    if (!byCase.some(function (c) { return c.minutes != null; })) {
      card.appendChild(h('p', { class: 'chart-summary' }, 'No submitted tickets yet.'));
      return card;
    }
    // Only submitted tickets have a measured time; an open ticket is not a 0-minute ticket.
    var submitted = byCase.filter(function (c) { return c.minutes != null; });
    var minutes = submitted.map(function (c) { return c.minutes; });
    var touches = submitted.map(function (c) { return c.touches || 0; });
    var n = submitted.length;
    card.appendChild(miniLineChart('Minutes per case, in order', minutes, 'var(--accent)'));
    card.appendChild(miniLineChart('Touches per case, in order', touches, 'var(--danger)'));
    var avgM = (minutes.reduce(function (a, b) { return a + b; }, 0) / n).toFixed(1);
    var avgT = (touches.reduce(function (a, b) { return a + b; }, 0) / n).toFixed(1);
    card.appendChild(h('p', { class: 'chart-summary' }, n + ' submitted ' + (n === 1 ? 'ticket' : 'tickets') + ' in order; average ' + avgM + ' minutes and ' + avgT + ' touches per ticket.'));
    return card;
  }

  function routesChart(routes) {
    var card = chartCard('Routes split');
    var entries = [['quick_verify', 'Quick verify', 'var(--positive)'], ['priority_review', 'Priority review', 'var(--warning)'], ['exception', 'Exception', 'var(--danger)']];
    var total = entries.reduce(function (sum, e) { return sum + (routes[e[0]] || 0); }, 0);
    card.appendChild(chartLegend(entries.map(function (e) { return { label: e[1], color: e[2] }; })));
    var w = 380, h2 = 60, pad = 10;
    var s = svg('svg', { viewBox: '0 0 ' + w + ' ' + h2, role: 'img', 'aria-hidden': 'true' });
    var x = pad;
    var barW = w - pad * 2;
    entries.forEach(function (e) {
      var count = routes[e[0]] || 0;
      var seg = total > 0 ? (count / total) * barW : 0;
      s.appendChild(svg('rect', { x: x, y: 15, width: seg, height: 30, fill: e[2] }));
      x += seg;
    });
    card.appendChild(s);
    var summary = entries.map(function (e) { return e[1] + ': ' + (routes[e[0]] || 0); }).join(', ');
    card.appendChild(h('p', { class: 'chart-summary' }, total ? (summary + ' (of ' + total + ' values).') : 'No values yet.'));
    return card;
  }

  function stageChart(stageSeconds) {
    var card = chartCard('Median seconds per stage');
    var stages = STAGE_CHART_KEYS.filter(function (key) { return stageSeconds[key] != null; });
    if (!stages.length) { card.appendChild(h('p', { class: 'chart-summary' }, 'No timing data yet.')); return card; }
    var w = 380, h2 = 180, pad = 30;
    var max = Math.max.apply(null, stages.map(function (s) { return stageSeconds[s]; }));
    var barW = (w - pad * 2) / stages.length;
    var s = svg('svg', { viewBox: '0 0 ' + w + ' ' + h2, role: 'img', 'aria-hidden': 'true' });
    stages.forEach(function (stage, i) {
      var v = stageSeconds[stage];
      var bh = max > 0 ? (h2 - pad * 2) * (v / max) : 0;
      var x = pad + i * barW;
      var y = h2 - pad - bh;
      s.appendChild(svg('rect', { x: x + 2, y: y, width: Math.max(barW - 4, 1), height: Math.max(bh, 0), fill: 'var(--accent)' }));
      var valueLabel = svg('text', { x: x + barW / 2, y: Math.max(y - 4, 10), 'text-anchor': 'middle', class: 'chart-axis-label' });
      valueLabel.textContent = v.toFixed(1) + 's';
      s.appendChild(valueLabel);
      var label = svg('text', { x: x + barW / 2, y: h2 - pad + 12, 'text-anchor': 'middle', class: 'chart-axis-label' });
      label.textContent = STAGE_CHART_LABELS[stage];
      s.appendChild(label);
    });
    card.appendChild(s);
    card.appendChild(h('p', { class: 'chart-summary' }, stages.map(function (s) { return STAGE_CHART_LABELS[s] + ': ' + stageSeconds[s].toFixed(1) + 's'; }).join(', ') + '.'));
    return card;
  }

  /* ---------- boot ---------- */
  if (state.offline) document.body.classList.add('offline');
  document.addEventListener('DOMContentLoaded', route);
})();
</script>
</body>
</html>
